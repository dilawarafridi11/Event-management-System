<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Events - Eventify</title>
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">🎟️</div>
          <span class="brand-text">Eventify</span>
        </a>
        <button class="sidebar-collapse-btn" title="Collapse Sidebar" aria-label="Collapse">◀</button>
      </div>

      <div class="sidebar-nav-container">
        <div class="nav-section-title">Attendee Portal</div>
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="events.html" class="nav-item active">
          <span class="nav-icon">🔍</span>
          <span class="nav-text">Discover Events</span>
        </a>
        <a href="bookings.html" class="nav-item">
          <span class="nav-icon">📑</span>
          <span class="nav-text">My Bookings</span>
        </a>
        <a href="favorites.html" class="nav-item">
          <span class="nav-icon">❤️</span>
          <span class="nav-text">Favorites</span>
        </a>
        <a href="tickets.html" class="nav-item">
          <span class="nav-icon">🎟️</span>
          <span class="nav-text">Digital Passes</span>
        </a>

        <div class="nav-section-title">Account</div>
        <a href="profile.html" class="nav-item">
          <span class="nav-icon">👤</span>
          <span class="nav-text">My Profile</span>
        </a>
        <a href="settings.html" class="nav-item">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Settings</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <a href="profile.html" class="user-snippet">
          <div class="avatar user-avatar-display">U</div>
          <div class="user-snippet-info">
            <div class="user-snippet-name user-name-display">Sophia Martinez</div>
            <div class="user-snippet-role">Event Attendee</div>
          </div>
        </a>
        <div style="margin-top: 0.5rem;">
          <button class="btn btn-ghost btn-sm btn-full text-danger" data-action="logout" style="justify-content: flex-start;">
            <span>🚪</span>
            <span class="logout-btn-text">Sign Out</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" aria-label="Open Menu">☰</button>
          <div class="header-title-group">
            <h1>Discover Events</h1>
            <p>Explore upcoming concerts, workshops, conferences, and festivals.</p>
          </div>
        </div>

        <div class="header-right">
          <button class="btn-icon theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
            <span class="theme-toggle-icon"></span>
          </button>
          <div class="dropdown-wrapper">
            <button class="avatar user-avatar-display" data-toggle="dropdown" aria-label="Profile">U</button>
            <div class="dropdown-menu">
              <a href="profile.html" class="dropdown-item">👤 Profile</a>
              <div class="dropdown-divider"></div>
              <div class="dropdown-item text-danger" data-action="logout">🚪 Sign Out</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body fade-in">
        <!-- Interactive Category Filter Chips -->
        <div class="category-filter-bar">
          <button class="filter-chip active" data-category="All">🌟 All Events</button>
          <button class="filter-chip" data-category="Conference">🎤 Conferences</button>
          <button class="filter-chip" data-category="Concert">🎵 Concerts</button>
          <button class="filter-chip" data-category="Workshop">💻 Workshops</button>
          <button class="filter-chip" data-category="Wedding">💍 Weddings</button>
          <button class="filter-chip" data-category="Seminar">🌱 Seminars</button>
          <button class="filter-chip" data-category="Sports">🏆 Sports</button>
          <button class="filter-chip" data-category="Exhibition">🎨 Exhibitions</button>
          <button class="filter-chip" data-category="Party">🍸 Parties</button>
        </div>

        <!-- Filter Controls Toolbar -->
        <div class="card" style="padding: 1.25rem; margin-bottom: 2rem;">
          <div class="grid" style="grid-template-columns: 2fr 1fr 1fr; gap: 1.25rem; align-items: center;">
            <!-- Search -->
            <div class="input-icon-wrapper">
              <span class="input-icon">🔍</span>
              <input type="text" id="discover-search" class="form-control" placeholder="Search by title, topic, or venue...">
            </div>

            <!-- Price Slider Filter -->
            <div>
              <div class="flex justify-between text-xs font-semibold text-secondary" style="margin-bottom: 0.25rem;">
                <span>Max Ticket Price:</span>
                <span id="price-slider-val" class="text-primary font-bold">$500</span>
              </div>
              <input type="range" id="discover-price-range" min="0" max="500" step="10" value="500" style="width: 100%; accent-color: var(--accent-primary);">
            </div>

            <!-- Sort dropdown -->
            <div>
              <select id="discover-sort" class="form-control">
                <option value="date-asc">Date (Soonest First)</option>
                <option value="date-desc">Date (Furthest First)</option>
                <option value="price-low">Price (Lowest First)</option>
                <option value="price-high">Price (Highest First)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Events Grid -->
        <div class="events-grid" id="discover-events-grid">
          <!-- Populated via user.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/bookings.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/user.js"></script>
  <script src="../js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      User.initEventsPage();

      // Check URL query parameters for pre-selected category
      const urlParams = new URLSearchParams(window.location.search);
      const cat = urlParams.get('cat');
      if (cat) {
        const chip = document.querySelector(`.filter-chip[data-category="${cat}"]`);
        if (chip) chip.click();
      }
    });
  </script>
</body>
</html>
