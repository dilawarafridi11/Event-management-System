<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Eventify</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 2rem 1rem;">

  <!-- Theme Toggle Floating -->
  <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
    <button class="btn-icon theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <span class="theme-toggle-icon"></span>
    </button>
  </div>

  <div style="width: 100%; max-width: 520px;" class="fade-in">
    <!-- Brand Logo -->
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <img src="images/logo.png" alt="Logo" class="brand-icon" style="width: 24px; height: 24px; object-fit: contain;">
        <span>Eventify</span>
      </a>
      <p class="text-secondary text-sm">Join thousands of event creators and attendees.</p>
    </div>

    <!-- Register Card -->
    <div class="card" style="padding: 2.25rem;">
      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
            <input type="text" id="reg-name" class="form-control" placeholder="Jane Doe" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-role">Account Type</label>
            <select id="reg-role" class="form-control">
              <option value="User">Event Attendee</option>
              <option value="Organizer">Event Organizer</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="reg-email" class="form-control" placeholder="jane@example.com" required>
          </div>
        </div>

        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-location">City / State</label>
            <input type="text" id="reg-location" class="form-control" placeholder="Austin, TX">
          </div>
        </div>

        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 chars" required minlength="6" oninput="checkPasswordStrength(this.value)">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password <span class="required">*</span></label>
            <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password" required minlength="6">
          </div>
        </div>

        <!-- Password Strength Meter -->
        <div style="margin-bottom: 1.25rem;">
          <div style="height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden; margin-bottom: 4px;">
            <div id="password-strength-bar" style="height: 100%; width: 0%; transition: all 0.3s ease;"></div>
          </div>
          <div class="text-xs text-muted" id="password-strength-text">Password strength</div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" required style="accent-color: var(--accent-primary);">
            <span>I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-submit-btn">
          Create Free Account
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" class="font-semibold">Sign in</a>
      </div>
    </div>

    <!-- Back to Home -->
    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="index.html" class="text-secondary text-xs">← Return to Eventify Home</a>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    function checkPasswordStrength(password) {
      const bar = document.getElementById('password-strength-bar');
      const text = document.getElementById('password-strength-text');
      
      if (!password) {
        bar.style.width = '0%';
        text.textContent = 'Password strength';
        return;
      }

      let score = 0;
      if (password.length >= 6) score += 25;
      if (password.length >= 10) score += 25;
      if (/[A-Z]/.test(password)) score += 25;
      if (/[0-9!@#PKR %^&*]/.test(password)) score += 25;

      bar.style.width = score + '%';

      if (score <= 25) {
        bar.style.background = 'var(--danger)';
        text.textContent = 'Weak password';
        text.style.color = 'var(--danger)';
      } else if (score <= 75) {
        bar.style.background = 'var(--warning)';
        text.textContent = 'Moderate password';
        text.style.color = 'var(--warning)';
      } else {
        bar.style.background = 'var(--success)';
        text.textContent = 'Strong password';
        text.style.color = 'var(--success)';
      }
    }

    // Initialize seed data for offline fallback
    Storage.init();

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const location = document.getElementById('reg-location').value;
      const role = document.getElementById('reg-role').value;
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const submitBtn = document.getElementById('register-submit-btn');

      if (password !== confirm) {
        UI.showToast('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spin"><i class="fa-solid fa-rotate-right"></i></span> Creating Account...`;

      try {
        // Try backend API registration first
        const apiResult = await API.register({ name, email, phone, location, role, password });

        if (apiResult && apiResult.success && apiResult.data && apiResult.data.user) {
          const user = apiResult.data.user;
          // Save session to localStorage for route guards
          const sessionData = {
            id: user.id,
            name: user.name,
            email: user.email,
            role: user.role,
            avatar: user.avatar,
            phone: user.phone,
            location: user.location,
            loginTime: new Date().toISOString(),
            token: apiResult.data.token
          };

          if (user.role === 'SuperAdmin' || user.role === 'Organizer') {
            localStorage.setItem(STORAGE_KEYS.ADMIN_SESSION, JSON.stringify(sessionData));
          } else {
            localStorage.setItem(STORAGE_KEYS.USER_SESSION, JSON.stringify(sessionData));
          }

          UI.showToast('Account created successfully! Redirecting...', 'success', 'Welcome');
          setTimeout(() => {
            window.location.href = (user.role === 'SuperAdmin' || user.role === 'Organizer') ? 'admin/dashboard.html' : 'user/dashboard.html';
          }, 600);
          return;
        }

        // If API returned an error (server reachable but registration failed)
        if (apiResult && apiResult.success === false && apiResult.message) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Free Account';
          UI.showToast(apiResult.message, 'error', 'Registration Failed');
          return;
        }
      } catch (err) {
        console.warn('[Register] API server unavailable, falling back to offline mode:', err);
      }

      // Fallback: client-side localStorage registration (offline / demo mode)
      const result = Auth.register({ name, email, phone, location, role, password });

      if (!result.success) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Free Account';
        UI.showToast(result.message, 'error', 'Registration Failed');
        return;
      }

      UI.showToast('Account created successfully! Redirecting...', 'success', 'Welcome');
      setTimeout(() => {
        window.location.href = 'user/dashboard.html';
      }, 600);
    }
  </script>
</body>
</html>
